<!--
  A titled frame: the border is interrupted at the top left, where the label
  would go.  Four bars and not a rectangle with a hole, precisely because the
  border is missing a piece.

  No floating block where the title goes: at 16 pixels a block against the
  corner reads as a folder.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect x="1" y="4" width="1.4" height="10"/>
  <rect x="13.6" y="4" width="1.4" height="10"/>
  <rect x="1" y="12.6" width="14" height="1.4"/>
  <rect x="1" y="4" width="2.2" height="1.4"/>
  <rect x="8.4" y="4" width="6.6" height="1.4"/>
</svg>
