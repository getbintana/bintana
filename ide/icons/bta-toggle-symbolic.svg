<!--
  A button that stays in: the frame, and the face pressed into it.

  The hole is a second subpath under fill-rule="evenodd" and not a white shape:
  GTK recolours a symbolic icon by forcing the fill, so anything painted white
  comes out in the theme's colour too and the icon is a solid block.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M1 4h14v8H1z M2.2 5.2v5.6h11.6V5.2z"/>
  <path d="M3.6 6.6h8.8v2.8H3.6z"/>
</svg>
