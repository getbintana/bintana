<?xml version="1.0" encoding="UTF-8"?>
<!--
  A table: a header band and a grid of cells.

  Drawn with fills and no strokes, which is the rule for an own -symbolic icon
  here: GTK recolours by forcing `fill`, so a stroke keeps the colour written in
  the file and comes out black on a dark theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <path d="M1 2h14v3H1z"/>
  <path d="M1 6h4v3H1zM6 6h4v3H6zM11 6h4v3h-4z"/>
  <path d="M1 10h4v3H1zM6 10h4v3H6zM11 10h4v3h-4z"/>
</svg>
