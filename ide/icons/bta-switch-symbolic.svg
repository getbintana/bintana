<!--
  A setting flipped on: the trough, and the knob at the end of it.

  The trough is hollow through a second subpath under fill-rule="evenodd", as
  the toggle and check icons are: GTK recolours a symbolic icon by forcing the
  fill, so anything painted white comes out in the theme's colour too.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M4.5 4h7a4 4 0 0 1 0 8h-7a4 4 0 0 1 0-8z M4.5 5.2a2.8 2.8 0 0 0 0 5.6h7a2.8 2.8 0 0 0 0-5.6z"/>
  <path d="M11.2 5.7a2.3 2.3 0 1 1 0 4.6 2.3 2.3 0 0 1 0-4.6z"/>
</svg>
