# Builds the runtime and runs the test projects.
#
# The suite needs a display and finds one on its own: with no DISPLAY,
# tests/run.sh falls back to Xvfb, so nothing here has to set one up beyond
# installing it.
name: build and test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-4-dev libgtksourceview-5-dev libvte-2.91-gtk4-dev \
            libsqlite3-dev libsoup-3.0-dev libxml2-dev \
            libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-tools \
            xvfb xdotool desktop-file-utils \
            librsvg2-common fonts-cantarell

          # The last two are named for a reason `--no-install-recommends`
          # hides: they are recommends of GTK rather than dependencies, and the
          # suite is about both.  **`librsvg2-common` is the SVG loader** --
          # without it nothing renders an SVG, and `Application.HasIcon`
          # *renders* and looks for ink, so every icon assertion fails with a
          # picture that is not there.  **`fonts-cantarell` is the font the
          # metrics assertions were written against** -- a label at `Cantarell
          # 11.5` measured against a substituted font is a different number.

          # The GTK4 video sink lives in gst-plugins-rs, which not every
          # release packages -- and a Video is the only thing that needs it, so
          # a runner without it skips the video half of the media test and runs
          # the audio one. Its own line, and allowed to fail, because an
          # unavailable package in the list above would abort the whole install.
          sudo apt-get install -y --no-install-recommends gstreamer1.0-gtk4 \
            || echo "no gstreamer1.0-gtk4: the media test will skip the video half"

      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build -j"$(nproc)"

      - name: Test
        run: ./tests/run.sh

      # Is `docs/llm/` still the whole public surface, is
      # `tools/typings/bintana.d.ts` still the runtime's, and does every link in
      # `docs/` still land on a file? All three are claims that cost nothing
      # unless something fails when they stop being true. The second is about a
      # **generated** file and the third about a deleted one -- which are
      # exactly the kinds that go stale without looking stale. Cheap: it parses
      # C and Markdown and opens no window.
      - name: The documented surface, the declared one, and the links
        run: ./tests/api.sh

      # What `make install` produces, run out of a staging prefix under /tmp.
      # A step of this job and not one of its own: it installs the build the
      # step above just tested, and re-building it somewhere else would only
      # be re-testing the compiler.
      #
      # It brings up its own Xvfb rather than going through xvfb-run, so it
      # needs no display arranged for it -- but it does need `xdotool`, which
      # is the only dependency here that the suite does not already have.
      - name: Test the install
        run: ./tests/install.sh

  # **The vendored QuickJS is a commit of the fork's branch.** A submodule pins
  # one commit and `git submodule update --remote` can pin any commit at all, so
  # this is what says it is a point on `getbintana/quickjs`'s `bintana` and not
  # something that fell out of a rebase.  A job of its own because it wants the
  # submodule's full history, and every other job is content with the one commit
  # it builds.
  pin:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: The vendored QuickJS is on the fork's bintana branch
        run: |
          git -C vendor/quickjs fetch origin bintana
          git -C vendor/quickjs merge-base --is-ancestor HEAD FETCH_HEAD

  # A second job and not a second step: it builds the whole runtime again with
  # clang and the sanitizer, so failing here says something different from
  # failing above and the two should be readable apart.
  sanitizer:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang \
            libgtk-4-dev libgtksourceview-5-dev libvte-2.91-gtk4-dev \
            libsqlite3-dev libsoup-3.0-dev libxml2-dev \
            libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-tools \
            xvfb \
            librsvg2-common fonts-cantarell
          sudo apt-get install -y --no-install-recommends gstreamer1.0-gtk4 \
            || echo "no gstreamer1.0-gtk4: the media test will skip the video half"

      # What this catches is what a machine catches and a person does not: both
      # memory bugs this codebase has had were use-after-free that crashed on
      # some machines and not others, and it was the sanitizer -- being slow
      # enough for a timeout to land before the report -- that exposed a block of
      # assertions that had not run in months.
      #
      # It runs headless on its own: tests/asan.sh exports HEADLESS=1.
      - name: Test under AddressSanitizer
        run: ./tests/asan.sh

  # A third job, and the only one that proves the optional half of an optional
  # dependency: `Terminal` without VTE. Nothing else can -- the two jobs above
  # both have it, so every `#else` in bta_terminal.c is dead code there, and the
  # one time it mattered it was a class that could not load out of a `.form`.
  #
  # `vte-2.91-gtk4` is simply not installed here, which is the honest version of
  # the test: CMake looks, does not find it, says so, and the runtime builds. The
  # suite then runs against that binary and the terminal assertions take their
  # other branch -- `tests/widgets`' testTerminal checks the state answers and
  # the verbs refuse, and `tests/ide` checks the palette has no button and the
  # bottom panel has one page.
  #
  # BINTANA_LIB_PATH because the binary is not ./build/bintana: `lib/` is found
  # relative to the executable, and a build in another directory would fail
  # twelve chart assertions for a reason that has nothing to do with VTE.
  no-vte:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies, without VTE
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-4-dev libgtksourceview-5-dev \
            libsqlite3-dev libsoup-3.0-dev libxml2-dev \
            libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-tools \
            xvfb \
            librsvg2-common fonts-cantarell
          sudo apt-get install -y --no-install-recommends gstreamer1.0-gtk4 \
            || echo "no gstreamer1.0-gtk4: the media test will skip the video half"

      - name: Build without VTE
        run: |
          cmake -S . -B build-novte 2>&1 | tee cmake.log
          # It has to have *decided* it and not merely compiled: a runner that
          # grew libvte as some other package's dependency would make this whole
          # job a second copy of the first one, silently. CMake says which way it
          # went, so read it back.
          grep -q 'no vte:' cmake.log \
            || { echo "this runner has VTE: the job would prove nothing"; exit 1; }
          cmake --build build-novte -j"$(nproc)"

      - name: Test
        env:
          BINTANA: ./build-novte/bintana
          BINTANA_LIB_PATH: ${{ github.workspace }}/lib
        run: ./tests/run.sh

  # A fourth job, and the second optional half of an optional dependency:
  # `Printer.Names` and `Printer.Default` without GTK's Unix print backend.
  # Printing itself is core GTK and works either way; those two questions are
  # `gtk4-unix-print`, and a build without it refuses them with a sentence rather
  # than answering an empty list that cannot be told apart from a machine with no
  # printer.
  #
  # **This one has to hide the module rather than not install it**, which is the
  # honest difference from `no-vte` above. `gtk4-unix-print.pc` ships in the same
  # package as `gtk4.pc` (`libgtk-4-dev`), so there is no package to leave out --
  # and the platforms where the module really is absent are Windows and macOS,
  # where the suite does not run. A pkg-config that answers "no" for that one
  # name is the nearest thing to the real shape, and what it proves is what
  # matters: the `#ifndef BTA_HAVE_UNIX_PRINT` branch compiles, and the suite
  # takes its other road.
  #
  # Worth the job because of how that branch failed the one time it was run:
  # `Printer.Names` was read unguarded and the throw ended `Form_Open`, so the
  # project reported **one** failure and quietly skipped 1633 assertions.
  #
  # `tests/widgets` and not the whole suite: this dependency reaches exactly two
  # members, and both are asserted there. Widen it the day something else asks
  # the machine about printers.
  no-unix-print:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-4-dev libgtksourceview-5-dev \
            libsqlite3-dev libsoup-3.0-dev libxml2-dev \
            xvfb \
            librsvg2-common fonts-cantarell

      - name: Build with gtk4-unix-print hidden
        run: |
          set -euo pipefail
          mkdir -p fake
          # Everything but that one name goes through to the real pkg-config.
          printf '#!/bin/sh\ncase " $* " in *" gtk4-unix-print "*) exit 1;; esac\nexec /usr/bin/pkg-config "$@"\n' \
            > fake/pkg-config
          chmod +x fake/pkg-config

          cmake -S . -B build-noprint \
                -DPKG_CONFIG_EXECUTABLE="$PWD/fake/pkg-config" 2>&1 | tee cmake.log
          # It has to have *decided* it, not merely compiled: a wrapper that
          # stopped working would make this job a second copy of the first one,
          # silently. CMake says which way it went, so read it back -- the same
          # guard `no-vte` uses.
          grep -q 'no gtk4-unix-print:' cmake.log \
            || { echo "the module was found: this job would prove nothing"; exit 1; }
          cmake --build build-noprint -j"$(nproc)"

      - name: Test
        env:
          BINTANA: ./build-noprint/bintana
          BINTANA_LIB_PATH: ${{ github.workspace }}/lib
        run: |
          # **Arranged to leave a core behind**, because this job segfaulted
          # (exit 139, in the widgets project's async tail) and the crash did not
          # happen off the runner in forty runs. The core is what named it: an
          # `Exec` job freed with its `Control` read still armed, which the
          # runner's timing lost and a laptop's never did -- GTK 4.14 was a red
          # herring. `testExecControlLate` loses the race on purpose now, so it
          # is the sanitizer's to report anywhere. Kept, because the next crash
          # that only happens here has to explain itself where it happens.
          #
          # The core is the *child's*: tests/run.sh is a runner that spawns each
          # project, so `%p` in the pattern is what separates them, and a pattern
          # rather than the default is what gets a core out of a container at all.
          ulimit -c unlimited
          sudo mkdir -p /tmp/cores && sudo chmod 1777 /tmp/cores
          echo '/tmp/cores/core.%e.%p' | sudo tee /proc/sys/kernel/core_pattern
          ./tests/run.sh widgets

      # Only when the step above failed, and never a gate of its own: this
      # reports, it does not judge. `continue-on-error` so a missing core or a
      # gdb that cannot read it still leaves the real failure as the job's.
      - name: The backtrace, if it crashed
        if: failure()
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends gdb
          shopt -s nullglob
          found=
          for core in /tmp/cores/core.*; do
            found=1
            echo "===== $core"
            gdb -batch -ex "thread apply all bt 40" ./build-noprint/bintana "$core"
          done
          [ -n "$found" ] || echo "no core was written: the failure was not a crash"

  # A fifth job, and the third optional half: `Xml` without libxml2.  A
  # program that draws windows and reads JSON needs none of it, so the build
  # finds it when it is there and `Xml.Parse` refuses with a sentence when it
  # is not -- and the suite's XML tests take their other branch (`XmlFiles`,
  # `XmlRecord` and the worker's two lines), which is the only build that
  # proves that branch compiles and runs.
  #
  # **Hiding the module rather than not installing it**, like `no-unix-print`:
  # libxml2's headers may arrive as some other package's dependency, and a
  # runner that grew it would make this job a second copy of the first one,
  # silently.  The wrapper answers "no" for that one name and CMake's own line
  # is read back to prove it did.
  #
  # `tests/widgets` and not the whole suite: XML reaches exactly those three
  # places and all of them are there.  Nothing else in the tree calls it.
  no-libxml:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-4-dev libgtksourceview-5-dev \
            libsqlite3-dev libsoup-3.0-dev \
            xvfb \
            librsvg2-common fonts-cantarell

      - name: Build with libxml2 hidden
        run: |
          set -euo pipefail
          mkdir -p fake
          # Everything but that one name goes through to the real pkg-config.
          printf '#!/bin/sh\ncase " $* " in *" libxml-2.0 "*) exit 1;; esac\nexec /usr/bin/pkg-config "$@"\n' \
            > fake/pkg-config
          chmod +x fake/pkg-config

          cmake -S . -B build-noxml \
                -DPKG_CONFIG_EXECUTABLE="$PWD/fake/pkg-config" 2>&1 | tee cmake.log
          # It has to have *decided* it, not merely compiled: the same guard
          # `no-vte` and `no-unix-print` carry, for the same reason.
          grep -q 'no libxml2:' cmake.log \
            || { echo "this runner has libxml2: the job would prove nothing"; exit 1; }
          cmake --build build-noxml -j"$(nproc)"

      - name: Test
        env:
          BINTANA: ./build-noxml/bintana
          BINTANA_LIB_PATH: ${{ github.workspace }}/lib
        run: ./tests/run.sh widgets

  # The downloadable one: the same tree `cmake --install` lays down, as a
  # tarball, so somebody without a compiler can run the IDE and the examples.
  #
  # **The IDE is data, not a binary.** It is the `ide/` project directory --
  # `.js`, `.form`, `po/`, `icons/` -- interpreted by `bintana`, and the runtime
  # finds everything relative to its own executable: the IDE at
  # `<bin>/../share/bintana/ide` (that is what the `bintana-ide` launcher execs),
  # the shipped libraries at `<bin>/../share/bintana/lib`, and the reference F1
  # reads at `<bin>/../share/doc/bintana/docs/reference`. So the tarball *is* the
  # install prefix, extracted anywhere:
  #
  #     tar xzf bintana-<version>-linux-<arch>.tar.gz
  #     ./bin/bintana-ide                    # the IDE, from a shell
  #     ./bin/bintana-ide ~/my-project       # ...opening a project
  #     ./bin/bintana share/bintana/examples/hello
  #
  # **Built with the minimum dependencies on purpose.** The optional ones
  # (sqlite, soup, GStreamer, VTE, libxml2) would each become a shared library
  # the downloader must have; without them the binary still runs, and the
  # features that need one say which package is missing -- and libxml2 is
  # *hidden* rather than merely not installed, because its headers can arrive
  # as some other package's dependency and the tarball would then link a
  # library nobody asked for. A distribution package is the opposite trade and
  # is a packager's to make.
  #
  # **What it does not bundle is GTK.** The tarball needs GTK 4.10+ and
  # GtkSourceView 5 on the machine, and glibc at least as new as ubuntu-24.04's
  # (2.39) because it is built here. An AppImage, or a build on an older base,
  # is the next step if it has to reach further back.
  package:
    runs-on: ubuntu-24.04

    # The default token is read-only on a new repository, and `gh release
    # create` needs to write. Only this job asks for it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-4-dev libgtksourceview-5-dev

      # `--prefix <staging>` at install time, configured for `/usr`: the archive
      # is then exactly a prefix tree -- `bin/`, `share/`, `lib/`, `include/` --
      # and `bintana.pc` still says `/usr`, which is where a real install puts
      # it.  The two paths that resolve from the binary are *relative* hops, so
      # they do not care where the tree is extracted: that is the argument
      # `tools/bintana-ide.in` and `lib_candidates` both make.
      - name: Build and stage
        run: |
          set -euo pipefail
          # libxml2 hidden, and proved hidden: see the job's comment.
          mkdir -p fake
          printf '#!/bin/sh\ncase " $* " in *" libxml-2.0 "*) exit 1;; esac\nexec /usr/bin/pkg-config "$@"\n' \
            > fake/pkg-config
          chmod +x fake/pkg-config

          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr \
                -DPKG_CONFIG_EXECUTABLE="$PWD/fake/pkg-config" 2>&1 | tee cmake.log
          grep -q 'no libxml2:' cmake.log \
            || { echo "this runner has libxml2: the tarball would depend on it"; exit 1; }
          cmake --build build -j"$(nproc)"

          version=$(grep -m1 -oP 'project\(bintana VERSION \K[0-9][^ )]*' CMakeLists.txt)
          name="bintana-${version}-linux-$(uname -m)"

          cmake --install build --prefix "$PWD/stage/$name"
          tar -C "stage/$name" -czf "$name.tar.gz" .

          echo "$name.tar.gz" > tarball-name.txt
          ls -l "$name.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: bintana-linux
          path: bintana-*.tar.gz
          if-no-files-found: error

      # And, when the push is a tag, the same file where a person looks for a
      # download rather than in the run's artifacts. `gh` is on the runner and
      # the token is the run's own; the release is created on the first tag that
      # finds none.
      - name: Attach it to the release, when this is a tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=$(cat tarball-name.txt)
          # `|| true` on the create, because the *other* job that attaches an
          # asset to this tag may have made the release first -- and a race that
          # ends with the asset uploaded is a race nothing needs to report.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
                               --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "$file" --clobber

  # A fourth job, and the first one that is not Linux: the port's Stage 0/1
  # (docs/plans/portability-plan.md), whose deliverable is an error list as much
  # as a build.
  #
  # **What it proves today is the build, `tests/api.sh`, and that the zipped
  # tree runs** (`tools/windows-portable.sh`): the console project reads
  # `runtime/src` and the references, so it is the check that says the runtime
  # *runs* on Windows and not merely compiles, and it is run again out of the
  # staged tree -- which is what proves the DLL closure. The windowed projects
  # are deliberately not here: they need a desktop session, and the suite's
  # display handling (`xvfb-run`, `tests/icons`/`styles` reading a Linux theme
  # off the disk) is Linux's as it stands. VTE does not exist on Windows and is
  # not installed; `Terminal` refuses by name there, which is what
  # `BTA_HAVE_VTE` was made optional for. The IDE is started once and left to a
  # timeout as a diagnostic, not as a gate -- whether this runner has a desktop
  # is not something this file can know.
  #
  # The packages are MSYS2's UCRT64 ones, which is the toolchain the plan named:
  # MinGW-w64 with the UCRT C runtime, and GTK4 from the same ecosystem. **Never
  # mix an MSVC GStreamer with a MinGW GTK4** -- two GTK4 copies in one process --
  # which is why GStreamer is not in this list yet.
  windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    # The release the zip is attached to, when the push is a tag.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-libxml2

      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build -j"$(nproc)"

      # The same check the Linux jobs run, and it needs no display: it parses C
      # and Markdown. `.exe` is named because the shell's `-x` test is what
      # `tests/api.sh` uses to find the binary, and the answer differs by
      # platform.
      - name: The documented surface
        env:
          BINTANA: ./build/bintana.exe
        run: ./tests/api.sh

      # The download: the executable, everything it links, the GTK data GTK
      # opens by name, the IDE as the project directory it is and the `.cmd`
      # launcher -- `tools/windows-portable.sh`, which is where the recipe and
      # its reasons live.
      - name: Package the portable build
        run: |
          set -euo pipefail
          version=$(grep -m1 -oP 'project\(bintana VERSION \K[0-9][^ )]*' CMakeLists.txt)
          name="bintana-${version}-windows-$(uname -m)"

          tools/windows-portable.sh build "stage/$name"
          (cd "stage/$name" && cmake -E tar cf "$GITHUB_WORKSPACE/$name.zip" \
                                              --format=zip -- .)
          echo "$name.zip" > zip-name.txt
          ls -l "$name.zip"

      # And the staged tree is run, because a zip nobody opened is a guess.
      # `--version` proves the DLL closure; the api check proves the runtime
      # works out of a tree that is not the build one (`tests/api.sh` finds the
      # repository from its own path, so the project is still the checkout).
      - name: The staged tree runs
        run: |
          set -euo pipefail
          name=$(basename "$(cat zip-name.txt)" .zip)
          "stage/$name/bin/bintana.exe" --version
          BINTANA="$PWD/stage/$name/bin/bintana.exe" ./tests/api.sh

      # The first look at the IDE on Windows, and **not a hard step**: whether
      # this runner has a desktop for a window to open on is not something this
      # file can know. The log says what happened -- a timeout and no error is
      # the good outcome.
      - name: A first look at the IDE
        continue-on-error: true
        run: |
          name=$(basename "$(cat zip-name.txt)" .zip)
          timeout 20 "stage/$name/bin/bintana.exe" "stage/$name/share/bintana/ide" \
            && echo "the IDE exited by itself" \
            || echo "the IDE did not exit within 20s (exit $?) -- a timeout here is the good outcome"

      - uses: actions/upload-artifact@v4
        with:
          name: bintana-windows
          path: bintana-*.zip
          if-no-files-found: error

      - name: Attach it to the release, when this is a tag
        if: startsWith(github.ref, 'refs/tags/')
        # **Not the MSYS2 shell.** `gh` is installed on the Windows side and is
        # not on the MSYS2 PATH, so this step -- the same one the Linux jobs run
        # -- answered `gh: command not found` and left the tag with only the
        # tarball. Git Bash has it, and the workspace is where `zip-name.txt`
        # was written either way.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=$(cat zip-name.txt)
          # The same race as the Linux tarball's, from the other side.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
                               --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "$file" --clobber
