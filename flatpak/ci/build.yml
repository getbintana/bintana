# The Flatpak repository: what `flatpak remote-add bintana https://getbintana.github.io/flatpak/`
# serves. Copy this file to `.github/workflows/build.yml` in that repository,
# and `apps/` beside it; see README.md for the one-time setup.
#
# **The applications are discovered, not listed.** Every directory in `apps/`
# with an `app.json` is one, and adding an application is adding the directory
# -- nothing in this file names one. `tools/flatpak-plan` reads the registry and
# `builds.json` on `gh-pages` and prints what has to be rebuilt:
#
#   - a new tag, or no state at all      -> the BaseApp and every application;
#   - the runtime, `lib/`, the packaging -> the BaseApp and every application,
#     tool, the vendor                     because a base's files are copied
#                                          into each application at build time;
#   - `ide/**` or `examples/hello/**`    -> that application alone;
#   - an application's own repository    -> it alone, when its commit moved.
name: flatpak repository

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]

permissions:
  contents: write

env:
  RUNTIME: "50"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: The published repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published

      - name: This repository, for the registry
        uses: actions/checkout@v4
        with:
          path: ci

      - name: The runtime's source
        uses: actions/checkout@v4
        with:
          repository: getbintana/bintana
          path: sources/bintana
          fetch-depth: 0

      # One checkout per application with a repository of its own, named after
      # its directory in the registry. The ones that live in the runtime's
      # repository are the checkout above.
      - name: The applications' sources
        run: |
          set -euo pipefail
          for entry in ci/apps/*/app.json; do
              [ -e "$entry" ] || continue
              name=$(basename "$(dirname "$entry")")
              repo=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("repo",""))' "$entry")
              [ -n "$repo" ] || continue

              ref=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("ref",""))' "$entry")
              echo "== $name: $repo${ref:+ at $ref}"
              git clone --quiet ${ref:+--branch "$ref"} --depth 1 "$repo" "sources/$name"
          done

      - name: The tools
        run: |
          sudo apt-get update
          # Three host-side tools nothing declares, and every failure lands
          # after minutes of compiling:
          # - `elfutils`: flatpak-builder's `eu-strip`, which Ubuntu only
          #   Recommends -- *Failed to execute child process "eu-strip"*;
          # - `ostree`: what the build script initializes the repository with,
          #   because the target is a checkout of `gh-pages` with a `.git` in
          #   it -- *opendir(objects)* at the export;
          # - `librsvg2-common`: the host's gdk-pixbuf SVG loader, which
          #   `appstreamcli compose` rasterizes a scalable icon through -- and
          #   the x86_64 image ships without it, so the compose dies with
          #   `file-read-error`, naming no file.
          #
          # The rest builds the tool that writes a project's package
          # (`tools/pack.sh`): it is a Bintana program, so it needs the same
          # headers a developer does.
          sudo apt-get install -y --no-install-recommends \
              flatpak flatpak-builder appstream elfutils ostree librsvg2-common \
              build-essential cmake pkg-config \
              libgtk-4-dev libgtksourceview-5-dev
          flatpak remote-add --user --if-not-exists flathub \
              https://dl.flathub.org/repo/flathub.flatpakrepo

      # The SDK and the runtime are 800 MB, and they are the same every run.
      - name: Cache the runtime
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-${{ env.RUNTIME }}

      - name: The packaging tool
        run: |
          set -euo pipefail
          cmake -S sources/bintana -B sources/bintana/build \
                -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build sources/bintana/build -j"$(nproc)"

      - name: What changed
        id: plan
        run: |
          set -euo pipefail
          refs=$(sources/bintana/build/bintana sources/bintana/tools/flatpak-plan \
                     ci/apps sources published/builds.json | tr '\n' ' ')
          echo "decided: ${refs:-nothing}"
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
          echo "tag=$(git -C sources/bintana describe --tags --abbrev=0 || true)" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        if: steps.plan.outputs.refs != ''
        run: |
          set -euo pipefail
          sources/bintana/tools/flatpak-build.sh \
              "$PWD/published" ci/apps sources ${{ steps.plan.outputs.refs }}

          # What each ref that was just built is at now, so the next run knows
          # what moved. The entries of the applications this run did not build
          # are left where they were.
          python3 - "${{ steps.plan.outputs.tag }}" ${{ steps.plan.outputs.refs }} <<'EOF'
          import json, os, subprocess, sys

          tag, refs = sys.argv[1], sys.argv[2:]
          path  = "published/builds.json"
          state = json.load(open(path)) if os.path.exists(path) else {}
          state["tag"] = tag
          state.setdefault("apps", {})

          def commit(where):
              return subprocess.check_output(
                  ["git", "-C", where, "rev-parse", "HEAD"], text=True).strip()

          bintana = "https://github.com/getbintana/bintana.git"
          for ref in refs:
              if ref == "BaseApp":
                  state["base"] = commit("sources/bintana")
                  continue
              app = json.load(open(f"ci/apps/{ref}/app.json"))
              state["apps"][ref] = {
                  "repo":   app.get("repo", bintana),
                  "commit": commit(f"sources/{ref}" if app.get("repo") else "sources/bintana"),
              }

          json.dump(state, open(path, "w"), indent=2)
          EOF

          cd published
          git config user.name  "bintana-flatpak"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
              echo "nothing new to publish"
          else
              git commit -m "flatpak: ${{ steps.plan.outputs.refs }} at ${{ steps.plan.outputs.tag }}"
              git push
          fi
